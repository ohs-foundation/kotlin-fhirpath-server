name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, format, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so Spotless' `ratchetFrom = "origin/main"` can diff against it.
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # `build` runs the full check lifecycle: spotlessCheck (formatting + license headers),
      # test, plus compiling and assembling the jar/fat jar.
      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `git describe` can find the release tag to stamp the image with.
          fetch-depth: 0

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION="$(git describe --tags --always --dirty | sed 's/^v//')" \
            -t kotlin-fhirpath-server:ci .
